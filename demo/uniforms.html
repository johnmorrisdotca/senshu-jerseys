<!doctype html>
<html lang="en">
<head>
  <!--family:head-->
  <link rel="stylesheet" href="family.css" />
  <link rel="stylesheet" href="demo.css" />
  <link rel="stylesheet" href="judogi.css" />
  <link rel="stylesheet" href="uniforms.css" />
  <link rel="stylesheet" href="giRow.css" />
</head>
<body>
<main>
  <!--family:header-->
  <section class="more" aria-labelledby="uni-h">
    <h2 id="uni-h" data-say="uniformsTitle"></h2>
    <p data-say="uniformsIntro"></p>
    <p class="fam-fine"><a href="./" data-say="judoBack"></a> · <a href="judogi.html" data-say="uniformsDesigner"></a></p>
    <div class="fam-panels try judo-layout">
      <div class="fam-panel controls" id="uni-controls"></div>
      <div class="stagebox">
        <div class="stagepin">
          <div class="judo-view" id="uni-turntable" data-testid="uni-turntable" tabindex="0" role="group" aria-roledescription="turntable" data-say-label="judoViewLabel">
            <div class="stage" id="uni-stage" data-testid="uni-stage"></div>
          </div>
          <kazoku-view-controls id="uni-bar" data-testid="uni-bar" for="uni-turntable" address key-tilt="wheel" stop-turn tilt-step="1"></kazoku-view-controls>
        </div>
      </div>
    </div>
  </section>

  <section class="more" id="gi" aria-labelledby="gi-h">
    <h2 id="gi-h" data-say="giTitle"></h2>
    <p data-say="giIntro"></p>
    <div id="gi-row" data-testid="gi-row"></div>
  </section>
  <!--family:unreviewed-->
  <!--family:footer-->
</main>
<!--family:scripts uniforms.js-->
</body>
</html>
