<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Senshu Jerseys embed</title>
    <meta name="robots" content="noindex" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; color: #1f2320; }
      @media (prefers-color-scheme: dark) { html, body { color: #ece8dc; } }
      body { display: flex; align-items: center; justify-content: center; }
      #frame { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #frame svg { max-width: 100%; max-height: 100%; width: auto; height: auto; }
    </style>
  </head>
  <body>
    <div id="frame" data-testid="frame"></div>
    <script type="module">
      // A frame that draws what its address says: ?cut=hockey&colors=af1e2d,ffffff,192168&number=9&view=both, and `turn=1` to let it be turned by hand or `turn=auto` to turn by itself.
      // The address is read as text and the drawing checks every value; the frame fetches nothing.
      import { jerseyFromParams, renderJersey } from "./dist/index.js";
      import { bindTurn, jerseyFrame } from "./dist/turn-entry.js";
      const frame = document.getElementById("frame");
      const q = new URLSearchParams(location.search);
      const options = { ...jerseyFromParams(q), size: 400 };
      const turn = q.get("turn");
      // `volume=1` draws the shirt as a garment with depth, and `yaw` stops it at an angle (0 the front, 90 the wearer's right side, 180 the back).
      const volume = q.get("volume") === "1";
      const still = Number(q.get("yaw")) || 0;
      if (turn === "1" || turn === "auto") {
        // Turning shows one face at a time: `both` is the front.
        const box = document.createElement("div");
        box.style.width = "min(100%, 70vh)";
        frame.append(box);
        bindTurn(box, { ...options, view: options.view === "back" ? "back" : "front", volume }, { autoPlay: turn === "auto", yaw: q.has("yaw") ? still : options.view === "back" ? 180 : 0 });
      } else if (volume && options.view !== "both") {
        frame.innerHTML = jerseyFrame({ ...options, view: "front", volume, yaw: q.has("yaw") ? still : options.view === "back" ? 180 : 0 });
      } else {
        frame.innerHTML = renderJersey(options);
      }
      frame.dataset.ready = "true";
    </script>
  </body>
</html>
