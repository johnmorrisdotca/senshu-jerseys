<!doctype html>
<html lang="en">
<head>
  <!--family:head-->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a1130'/%3E%3Cpath d='M34 18L16 30L24 48L34 42V84H66V42L76 48L84 30L66 18Q50 34 34 18Z' fill='%23c8102e'/%3E%3Cpath d='M34 18Q50 34 66 18' fill='none' stroke='%23f4f0e4' stroke-width='5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="family.css" />
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
<main>
  <!--family:header-->

  <nav class="jump" id="jump" aria-label="Sections" data-say-label="navLabel">
    <a href="#try" data-say="navTry"></a><a href="#styles" data-say="navStyles"></a><a href="#wall" data-say="navWall"></a><a href="#officials" data-say="navOfficials"></a><a href="#rafters" data-say="navRafters"></a><a href="#teams" data-say="navTeams"></a><a href="#caps" data-say="navCaps"></a><a href="#embed" data-say="navEmbed"></a>
  </nav>

  <section class="more" id="try" aria-labelledby="try-h">
    <h2 id="try-h" data-say="tryTitle"></h2>
    <p data-say="tryText"></p>
    <div class="fam-panels try">
      <div class="fam-panel controls" id="controls"></div>
      <div class="stagebox">
        <div class="stage" id="stage" data-testid="stage"></div>
        <div class="fam-row"><label class="fam-label" for="background" data-say="background">Background</label><select class="fam-field" id="background" data-testid="background" data-say-label="backgroundHint" aria-label="A picture behind the stage, for the preview only: the jersey the package draws stays plain"><option value="" data-say="backgroundNone">None</option><option value="midnight">midnight</option><option value="crimson">crimson</option><option value="royal">royal</option><option value="emerald">emerald</option><option value="pitch">pitch</option><option value="ice">ice</option><option value="hardwood">hardwood</option><option value="infield">infield</option><option value="turf">turf</option><option value="ball-panels">ball-panels</option><option value="swirl">swirl</option><option value="waves">waves</option><option value="glow">glow</option><option value="floodlights">floodlights</option><option value="confetti">confetti</option><option value="carbon">carbon</option><option value="aurora">aurora</option><option value="sunburst">sunburst</option><option value="chevrons">chevrons</option><option value="halftone">halftone</option><option value="argyle">argyle</option><option value="contour">contour</option><option value="stardust">stardust</option><option value="mesh">mesh</option><option value="spotlight">spotlight</option></select></div>
        <div class="turnbar" id="turnbar">
          <label class="fam-label" for="yaw" data-say="angle"></label>
          <input class="range" type="range" id="yaw" min="-180" max="180" step="1" value="0" data-testid="yaw" />
          <output id="yaw-out" for="yaw">0°</output>
          <button type="button" class="fam-button" id="play" data-testid="play" aria-pressed="false" data-say="play"></button>
          <button type="button" class="fam-button" id="front" data-testid="front" data-say="front"></button>
        </div>
        <div class="turnbar" id="viewbar">
          <button type="button" class="fam-button" id="vol" data-testid="vol" aria-pressed="true" data-say="volume"></button>
          <button type="button" class="fam-button" id="cmp" data-testid="cmp" aria-pressed="false" data-say="compare"></button>
          <span class="viewbtns" role="group" data-say-label="viewsLabel" aria-label="Fixed views">
            <button type="button" class="fam-button" data-yaw-view="0" data-testid="view-front" data-say="viewFront"></button>
            <button type="button" class="fam-button" data-yaw-view="-90" data-testid="view-left" data-say="viewLeft"></button>
            <button type="button" class="fam-button" data-yaw-view="180" data-testid="view-back" data-say="viewBack"></button>
            <button type="button" class="fam-button" data-yaw-view="90" data-testid="view-right" data-say="viewRight"></button>
            <button type="button" class="fam-button" data-yaw-view="40" data-testid="view-three" data-say="viewThree"></button>
          </span>
        </div>
        <div class="compare" id="compare" data-testid="compare" hidden>
          <figure><div id="cmp-flat"></div><figcaption data-say="flatLabel"></figcaption></figure>
          <figure><div id="cmp-vol"></div><figcaption data-say="volLabel"></figcaption></figure>
        </div>
        <p class="fam-fine" id="turn-note" hidden data-say="turnBoth"></p>
      </div>
    </div>
  </section>

  <section class="more" id="styles" aria-labelledby="styles-h">
    <h2 id="styles-h" data-say="stylesTitle"></h2>
    <p data-say="stylesText"></p>
    <div class="wallbar"><span class="fam-seg" id="styles-way" role="group" data-say-label="stylesWay" aria-label="Home or away">
      <button type="button" data-way="home" data-testid="style-home" aria-pressed="true" data-say="stylesHome"></button>
      <button type="button" data-way="away" data-testid="style-away" aria-pressed="false" data-say="stylesAway"></button>
    </span></div>
    <ul class="wallgrid" id="styles-grid" data-testid="styles"></ul>
  </section>

  <section class="more" id="wall" aria-labelledby="wall-h">
    <h2 id="wall-h" data-say="wallTitle"></h2>
    <p data-say="wallText"></p>
    <div class="wallbar" id="wallbar"></div>
    <p class="fam-fine" id="wall-count" role="status" aria-live="polite" data-testid="wall-count"></p>
    <ul class="wallgrid" id="wallgrid" data-testid="wall"></ul>
    <p class="wallmore"><button type="button" class="fam-button" id="wall-more" data-testid="wall-more" hidden></button></p>
  </section>

  <section class="more" id="officials" aria-labelledby="officials-h">
    <h2 id="officials-h" data-say="officialsTitle"></h2>
    <p data-say="officialsText"></p>
    <div class="chips" id="officials-sports" role="group" data-testid="officials-sports"></div>
    <p class="fam-fine" id="officials-count" role="status" aria-live="polite" data-testid="officials-count"></p>
    <ul class="officialgrid" id="officials-grid" data-testid="officials"></ul>
  </section>

  <section class="more" id="rafters" aria-labelledby="rafters-h">
    <h2 id="rafters-h" data-say="raftersTitle"></h2>
    <p data-say="raftersText"></p>
    <div class="rafters" id="rafters-grid" data-testid="rafters"></div>
  </section>

  <section class="more" id="teams" aria-labelledby="teams-h">
    <h2 id="teams-h" data-say="teamsTitle"></h2>
    <p data-say="teamsText"></p>
    <div class="fam-panels builders">
      <div class="fam-panel" id="matchup-box">
        <h3 data-say="matchup"></h3>
        <div class="fam-row"><label class="fam-label" for="m-away" data-say="away"></label><select class="fam-field" id="m-away" data-testid="m-away"></select></div>
        <div class="fam-row"><label class="fam-label" for="m-home" data-say="home"></label><select class="fam-field" id="m-home" data-testid="m-home"></select></div>
        <div class="fam-row"><span class="fam-label" data-say="view"></span><div class="fam-seg" role="group" id="m-view" data-testid="m-view"></div><button type="button" class="fam-button" id="m-swap" data-say="swap"></button></div>
        <p class="fam-fine" id="m-clash" role="status"></p>
        <div class="out" id="m-out" data-testid="m-out"></div>
      </div>
      <div class="fam-panel" id="lineup-box">
        <h3 data-say="lineup"></h3>
        <div class="fam-row"><label class="fam-label" for="l-team" data-say="kitOf"></label><select class="fam-field" id="l-team" data-testid="l-team"></select></div>
        <div class="fam-row"><label class="fam-label" for="l-form" data-say="formation"></label><select class="fam-field" id="l-form" data-testid="l-form"></select></div>
        <div class="fam-row"><span class="fam-label" data-say="labels"></span><div class="fam-seg" role="group" id="l-labels" data-testid="l-labels"></div><button type="button" class="fam-button" id="l-field" aria-pressed="false" data-say="field"></button></div>
        <div class="out" id="l-out" data-testid="l-out"></div>
      </div>
    </div>
  </section>

  <section class="more" id="caps" aria-labelledby="caps-h">
    <h2 id="caps-h" data-say="capsTitle"></h2>
    <p data-say="capsText"></p>
    <div class="capsrow" id="caps-grid" data-testid="caps"></div>
  </section>

  <section class="more" id="embed" aria-labelledby="embed-h">
    <h2 id="embed-h" data-say="embedTitle"></h2>
    <p data-say="embedText"></p>
    <div class="fam-panels embed">
      <div class="fam-tabs" role="tablist" id="embed-tabs" data-testid="embed-tabs"></div>
      <div class="fam-panel">
        <p class="fam-fine" id="embed-note"></p>
        <div class="fam-row"><button type="button" class="fam-button" id="embed-turnable" aria-pressed="false" data-say="turnable"></button></div>
        <pre class="codebox" id="embed-box"><code id="embed-code" data-testid="embed-code"></code></pre>
        <div class="fam-actions"><button type="button" class="fam-button" data-primary="true" id="embed-copy" data-testid="embed-copy" data-say="copy"></button><button type="button" class="fam-button" id="embed-download" data-say="download" hidden></button><span class="fam-fine" id="embed-status" role="status" aria-live="polite"></span></div>
      </div>
    </div>
  </section>

  <div class="credits">
    <p class="fam-fine"><span data-say="credits"></span> <a href="https://github.com/johnmorrisdotca/senshu-jerseys/blob/main/docs/presets.md" data-say="presetsLink"></a></p>
  </div>
  <!--family:unreviewed-->
  <!--family:footer-->
</main>
<!--family:scripts demo.js-->
</body>
</html>
