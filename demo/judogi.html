<!doctype html>
<html lang="en">
<head>
  <!--family:head-->
  <link rel="stylesheet" href="family.css" />
  <link rel="stylesheet" href="demo.css" />
  <link rel="stylesheet" href="judogi.css" />
  <link rel="stylesheet" href="giRow.css" />
</head>
<body>
<main>
  <!--family:header-->
  <section class="more" aria-labelledby="judo-h">
    <h2 id="judo-h" data-say="judoTitle"></h2>
    <p data-say="judoIntro"></p>
    <p class="fam-fine"><a href="./" data-say="judoBack"></a></p>
    <div class="fam-panels try judo-layout">
      <div class="fam-panel controls" id="judo-controls"></div>
      <div class="stagebox">
        <div class="stagepin">
          <div class="judo-view" id="judo-turntable" data-testid="judo-turntable" tabindex="0" role="group" aria-roledescription="turntable" data-say-label="judoViewLabel">
            <div class="stage" id="judo-stage" data-testid="judo-stage"></div>
          </div>
          <kazoku-view-controls id="judo-bar" data-testid="judo-bar" for="judo-turntable" address stop-turn tilt-step="1"></kazoku-view-controls>
        </div>
        <p class="fam-fine" id="judo-flat-note" data-testid="judo-flat-note" data-say="judoFlatNote" hidden></p>
        <div class="fam-actions">
          <button type="button" class="fam-button" id="judo-svg" data-testid="judo-svg" data-say="judoExportSvg"></button>
          <button type="button" class="fam-button" id="judo-png" data-testid="judo-png" data-say="judoExportPng"></button>
        </div>
        <p class="fam-fine" id="judo-check" data-testid="judo-check"></p>
      </div>
    </div>
  </section>

  <section class="more" id="gi" aria-labelledby="gi-h">
    <h2 id="gi-h" data-say="giTitle"></h2>
    <p data-say="giIntro"></p>
    <div id="gi-row" data-testid="gi-row"></div>
  </section>
  <!--family:unreviewed-->
  <!--family:footer-->
</main>
<!--family:scripts judogi.js-->
</body>
</html>
